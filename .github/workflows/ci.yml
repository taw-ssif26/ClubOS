name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: clubos, POSTGRES_PASSWORD: clubos, POSTGRES_DB: clubos_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U clubos" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m app.cli migrate && python -m app.cli db-status
        env: { DATABASE_URL: "postgresql://clubos:clubos@localhost:5432/clubos_test", AUTO_CREATE_TABLES: "false" }
      - run: cd backend && pytest -q
        env: { DATABASE_URL: "postgresql://clubos:clubos@localhost:5432/clubos_test" }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npx tsc --noEmit && npm run build
