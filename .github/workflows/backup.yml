# Nightly encrypted database backup, kept as a GitHub Actions artifact (free). Needs two repository secrets:
#   DATABASE_URL       Neon DIRECT connection string
#   BACKUP_PASSPHRASE  long random passphrase. Store it in a password manager: without it the backups are unreadable.
# Keep the repository PRIVATE: the dump contains personal data (it is encrypted, but defence in depth).
name: backup
on:
  schedule: [{ cron: "30 20 * * *" }]   # 02:30 Bangladesh time
  workflow_dispatch: {}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump, compress, encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # pg_dump must be the same major version as the server; ask the server, then use the matching image.
          VER=$(docker run --rm postgres:17 psql "$DATABASE_URL" -Atc "show server_version_num" | cut -c1-2)
          docker run --rm postgres:$VER pg_dump "$DATABASE_URL" --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o clubos-$(date +%F).sql.gz.gpg
          ls -la clubos-*.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: clubos-db-backup
          path: clubos-*.sql.gz.gpg
          retention-days: 30
