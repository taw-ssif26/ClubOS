# Render Blueprint: the API on the FREE plan (sleeps after 15 min idle; wakes in about a minute).
# Create it via Render dashboard > New > Blueprint > pick this repo. Fill the `sync: false` values in the dashboard.
services:
  - type: web
    name: clubos-api
    runtime: python
    plan: free
    region: singapore            # closest to Bangladesh. Put the Neon database in AWS Singapore too.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ping       # /ping never touches the database, so health checks cannot burn Neon compute hours
    autoDeploy: true
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.8 }
      - { key: DATABASE_URL, sync: false }        # Neon DIRECT connection string (host without "-pooler"), ends with ?sslmode=require
      - { key: SECRET_KEY, sync: false }          # 48+ random chars. Never change after launch.
      - { key: PROXY_SECRET, sync: false }        # 48+ random chars. The SAME value goes into Vercel.
      - { key: BASE_URL, sync: false }            # https://yourdomain.com  (the Vercel site, NOT the Render URL)
      - { key: CORS_ORIGINS, sync: false }        # same value as BASE_URL
      - { key: BREVO_API_KEY, sync: false }       # Brevo > SMTP & API > API keys (the "xkeysib-..." key, not the SMTP key)
      - { key: SMTP_FROM, sync: false }           # ClubOS <no-reply@yourdomain.com>  (must be a VERIFIED SENDER in Brevo)
      - { key: COOKIE_SECURE, value: "true" }
      - { key: TRUSTED_PROXIES, value: "1" }      # Render's edge appends the connecting address; direct hits resolve correctly
      - { key: RUN_WORKER_IN_API, value: "true" } # free plan has no background workers
      - { key: WORKER_POLL_SECONDS, value: "900" }# slow poll so the Neon database can sleep
      - { key: EMAIL_DAILY_CAP, value: "300" }    # Brevo free = 300/day; verification email is sent before campaigns
      - { key: MEDIA_BACKEND, value: db }         # free plan has no disk: images live in Postgres
      - { key: MAX_UPLOAD_MB, value: "1" }
      - { key: DB_POOL_SIZE, value: "3" }
      - { key: DB_MAX_OVERFLOW, value: "2" }
